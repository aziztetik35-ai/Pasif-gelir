plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aziz.tvmouse'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aziz.tvmouse'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        release {
            storeFile file('tvmouse.keystore')
            storePassword 'tvmouse123'
            keyAlias 'tvmouse'
            keyPassword 'tvmouse123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
